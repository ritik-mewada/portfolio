# Keeps the pinned GitHub Actions and npm packages up to date. Each update arrives as a PR
# that has to pass CI before it can be merged; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates in one weekly PR; major versions get their own PR.
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades of these tools are migrations to plan, not routine bumps.
    # @types/node should track the Node version CI runs on, not the newest release.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
