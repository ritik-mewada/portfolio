name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# CI only reads the repo; it never needs to write to it.
permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress. Runs on main get a group of
# their own (per commit), so none is cancelled or queued behind another; the deploy waits for each.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Placeholder so the contact form's delivery tests run; requests to Web3Forms are mocked.
  NEXT_PUBLIC_WEB3FORMS_KEY: test-key

# The three jobs run in parallel, so CI takes as long as the slowest one (Lighthouse).
# The e2e and Lighthouse jobs each build the site themselves: a build takes about 15 s,
# less than passing the output between jobs as an artifact would.
jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit

  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tests run headless, so only the headless shell is needed, not the full Chrome build.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Uses the Chrome preinstalled on the runner.
      - run: npx lhci autorun
      - run: node scripts/lighthouse-summary.mjs
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
